# Wrangler configuration for Brookfield's D1 database.
#
# This file matters in two situations:
#  1. Running `wrangler d1` commands locally (e.g. to apply schema.sql) —
#     `--local` uses this file's [[d1_databases]] block to know the binding
#     name, and doesn't need `database_id` to be real.
#  2. Deploying the app directly to Cloudflare Pages/Workers, where `env.DB`
#     is then injected automatically as a real D1Database binding — in that
#     case src/server/db/index.ts picks it up via globalThis.__D1_BINDING__
#     (see src/server/db/README.md for the one-line wiring).
#
# If instead you host this Next.js app elsewhere (Vercel, Node server, etc.)
# and talk to D1 over the REST API adapter, this file is not required at
# runtime — only CF_ACCOUNT_ID / CF_D1_DATABASE_ID / CF_API_TOKEN env vars
# are needed (see .env.example).

name = "brookfield-realty"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "brookfield-db"
database_id = "REPLACE_WITH_REAL_DATABASE_ID_AFTER_RUNNING_WRANGLER_D1_CREATE"

# Phase 3: CV storage for career applications. Only needed once deployed
# directly to Cloudflare Pages/Workers (see src/server/storage/README.md) —
# local dev falls back to the filesystem automatically.
[[r2_buckets]]
binding = "RESUMES"
bucket_name = "brookfield-resumes"

# Phase 3: outbound enquiry notifications via Cloudflare Email Routing —
# the $0 option, see COST_NOTES.md. Requires a destination address verified
# in the Cloudflare dashboard first. Only relevant if deployed directly to
# Cloudflare Pages/Workers; otherwise the Resend fallback (env vars in
# .env.example) is used instead.
[[send_email]]
name = "NOTIFY"
destination_address = "REPLACE_WITH_VERIFIED_DESTINATION_ADDRESS"
